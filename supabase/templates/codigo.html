<!doctype html>
<html lang="pt-BR">
  <body style="font-family: Arial, Helvetica, sans-serif; background:#f5f7fb; padding:24px; color:#1f2937;">
    <table role="presentation" width="100%" style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px; border-top:4px solid #22376b;">
      <tr><td>
        <p style="margin:0 0 16px; font-weight:bold; color:#22376b;">Eventos UFR · Universidade Federal de Rondonópolis</p>
        <h1 style="font-size:20px; margin:0 0 12px; color:#22376b;">Seu código de acesso</h1>
        <p style="margin:0 0 20px;">Use o código abaixo para entrar na plataforma de eventos da UFR:</p>
        <p style="font-size:32px; letter-spacing:8px; font-weight:bold; text-align:center; background:#e8eef8; color:#22376b; border-radius:8px; padding:16px; margin:0 0 20px;">{{ .Token }}</p>
        <p style="margin:0; font-size:13px; color:#6b7280;">O código vale por 15 minutos. Se você não pediu, ignore este e-mail.</p>
      </td></tr>
    </table>
  </body>
